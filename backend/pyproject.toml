[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lae"
version = "0.1.0"
description = "Lineage-Aware Erasure Engine (research prototype)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "sqlglot==30.29.0",          # pinned: lineage behaviour changes across releases
    "networkx>=3.3",
    "pgvector>=0.3",
    "cryptography>=42",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
]

[project.scripts]
lae = "lae.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib -m \"not bench\""
markers = [
    "unit: pure tests, no database",
    "integration: requires a real PostgreSQL (LAE_TEST_DATABASE_URL)",
    "e2e: end-to-end through services/API against real PostgreSQL",
    "bench: benchmarks (excluded by default)",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF", "N"]
ignore = ["S101", "N818"]   # assert allowed; exception names are frozen contract names

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S608"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["lae"]
plugins = []

[[tool.mypy.overrides]]
module = ["networkx.*", "sqlglot.*", "pgvector.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "lae"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain modules never touch the DB layer, services, API, ORM or web framework"
type = "forbidden"
source_modules = [
    "lae.discovery", "lae.lineage", "lae.planner",
    "lae.executor", "lae.verification", "lae.audit",
]
forbidden_modules = ["lae.db", "lae.services", "lae.api", "sqlalchemy", "fastapi"]

[[tool.importlinter.contracts]]
name = "Contracts are the bottom layer"
type = "forbidden"
source_modules = ["lae.contracts", "lae.errors"]
forbidden_modules = [
    "lae.db", "lae.services", "lae.api", "lae.discovery", "lae.lineage",
    "lae.planner", "lae.executor", "lae.verification", "lae.audit",
]

[[tool.importlinter.contracts]]
name = "Lineage graph is independent of discovery/planning/execution"
type = "forbidden"
source_modules = ["lae.lineage"]
forbidden_modules = ["lae.discovery", "lae.planner", "lae.executor", "lae.verification"]

[[tool.importlinter.contracts]]
name = "Executor is independent of planner internals and discovery"
type = "forbidden"
source_modules = ["lae.executor"]
forbidden_modules = ["lae.discovery", "lae.planner", "lae.lineage", "lae.verification"]

[[tool.importlinter.contracts]]
name = "Audit depends only on contracts, errors, cryptography and stdlib"
type = "forbidden"
source_modules = ["lae.audit"]
forbidden_modules = [
    "lae.discovery", "lae.lineage", "lae.planner", "lae.executor", "lae.verification",
    "networkx", "sqlglot", "pydantic",
]
