# Alembic configuration for the `lae` engine schema.
# The database URL is NEVER stored here. Resolution order (migrations/env.py):
#   1. `alembic -x url=postgresql+psycopg://...`
#   2. sqlalchemy.url set programmatically (tests)
#   3. LAE_DATABASE_URL (environment / .env via lae.config.Settings)

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
