# Local development stack. Dev-only credentials; override via .env (gitignored).
name: lae

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lae_owner
      POSTGRES_PASSWORD: ${LAE_DB_PASSWORD:-lae_owner_dev}
      POSTGRES_DB: lae
    ports:
      - "127.0.0.1:5433:5432"  # localhost only (security review H1)
    volumes:
      - lae_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP on purpose: the temporary server of the first-start init scripts listens on the socket only
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lae_owner -d lae"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  lae_pgdata:
