# CI quality gates (same as scripts/check.ps1). Written for GitHub Actions; not executed locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lae_owner
          POSTGRES_PASSWORD: lae_owner_ci   # ephemeral CI container only
          POSTGRES_DB: lae
        ports: ["127.0.0.1:5433:5432"]
        options: >-
          --health-cmd "pg_isready -U lae_owner -d lae"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      PG_SERVER: postgresql+psycopg://lae_owner:lae_owner_ci@localhost:5433
      LAE_DATABASE_URL: postgresql+psycopg://lae_owner:lae_owner_ci@localhost:5433/lae
      LAE_ADMIN_URL: postgresql://lae_owner:lae_owner_ci@localhost:5433/postgres
      LAE_TARGET_SCHEMAS: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./backend[dev]" -c backend/constraints.txt
      - name: ruff
        run: |
          ruff check backend && ruff format --check backend
          ruff check --config backend/pyproject.toml benchmarks scripts
          ruff format --check --config backend/pyproject.toml benchmarks scripts
      - name: mypy
        run: mypy backend/src/lae
      - name: lint-imports
        working-directory: backend
        run: lint-imports --config pyproject.toml
      - name: unit tests
        run: pytest backend/tests -m unit -q -p no:cacheprovider
      - name: test databases (roles, extensions, schemas)
        run: python scripts/create_test_dbs.py   # lae_test + lae_test_{qa,bench,disc,erasure,lead,verif}
      - name: integration tests (one database per directory; discovery/verification pin theirs)
        run: |
          set -e
          LAE_TEST_DATABASE_URL="$PG_SERVER/lae_test" pytest backend/tests/integration/db -m integration -q -p no:cacheprovider
          LAE_TEST_DATABASE_URL="$PG_SERVER/lae_test_disc" pytest backend/tests/integration/discovery -m integration -q -p no:cacheprovider
          LAE_TEST_DATABASE_URL="$PG_SERVER/lae_test_lead" pytest backend/tests/integration/services -m integration -q -p no:cacheprovider
          LAE_TEST_DATABASE_URL="$PG_SERVER/lae_test_verif" pytest backend/tests/integration/verification -m integration -q -p no:cacheprovider
      - name: e2e / security tests
        env:
          LAE_TEST_DATABASE_URL: ${{ env.PG_SERVER }}/lae_test_qa
        run: pytest backend/tests/e2e -m e2e -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
